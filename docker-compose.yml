# Sobe apenas o PostgreSQL localmente para desenvolvimento.
# Uso: docker compose up -d
version: "3.8"
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: fc_pro_clubs
    ports:
      - "5432:5432"
    volumes:
      - fc_pro_clubs_data:/var/lib/postgresql/data

volumes:
  fc_pro_clubs_data:
